[package]
name = "nativeres-psp"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "NativeRes's PSP side: the kernel module nativeres.prx (the game's GE and display calls -> event ring, VRAM copies)"

# Built for mipsel-sony-psp only (scripts/build-psp-plugin.sh), not for the PC.
[[bin]]
name = "nativeres"
path = "src/main.rs"
test = false
bench = false

[dependencies]
nativeres-core = { path = "../core" }
