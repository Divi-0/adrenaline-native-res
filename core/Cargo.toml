[package]
name = "nativeres-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PSP graphics engine (GE) display list handling, independent of the Vita"

[features]
# The measuring hooks on the capture's hot paths: phase markers (phase.rs,
# for `liveprofile`), cycle points (cycles.rs, `livecycles`) and experiment
# bits (bench.rs, `benchexp`). Off, each hook is a constant and compiles to
# nothing: on, their ~85 checks per PRIM batch (a load and a branch each,
# from a cold branch predictor) cost MTX's race start ~2.2 ms of walk per
# frame (2026-11-21). The development plugin's profiling build and the PC
# replay tool turn it on.
instrument = []
# Debug hooks (debug_hooks.rs): points where the development plugin runs its
# own code (its thread timeline). Off (the release plugin), none of it is in
# the binary.
debug-hooks = []

[lib]
name = "nativeres_core"
