[package]
name = "nativepsp-vita"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "NativeRes's Vita side: the renderer the taiHEN plugin adrenaline-native-res.suprx runs (plugin/ builds it)"

# A library only: plugin/ links it into the plugin. (Building it as a
# staticlib here too made link-time optimisation keep every public function:
# +60% code.) A crate building its own plugin on top of this one links it
# the same way and registers extensions (src/ext.rs).
[lib]
name = "nativepsp_vita"

[dependencies]
nativepsp-core = { path = "../core" }
